<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- resume.json -->
  <rect x="10" y="30" width="190" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="105" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Reactive Resume export</text>
  <text x="105" y="79" text-anchor="middle" font-size="12.5" fill="#57606a">resume.json — the real resume</text>

  <!-- spec.json -->
  <rect x="10" y="130" width="190" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="105" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">spec.json</text>
  <text x="105" y="179" text-anchor="middle" font-size="12.5" fill="#57606a">bullet order per role</text>

  <!-- builder -->
  <rect x="330" y="70" width="220" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="440" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">build_variant.py</text>
  <text x="440" y="119" text-anchor="middle" font-size="12.5" fill="#57606a">reorder only — never edits text</text>

  <!-- variant PDF -->
  <rect x="680" y="30" width="190" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="775" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">variant PDF</text>
  <text x="775" y="79" text-anchor="middle" font-size="12.5" fill="#57606a">same words, best evidence first</text>

  <!-- verify -->
  <rect x="330" y="170" width="220" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="440" y="194" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">verify.py</text>
  <text x="440" y="213" text-anchor="middle" font-size="12.5" fill="#57606a">proves each list is an exact permutation</text>

  <!-- arrows -->
  <path d="M 200 55 C 260 55, 270 85, 328 92" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 200 155 C 260 155, 270 120, 328 110" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 550 85 C 610 85, 620 65, 678 60" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 440 170 L 440 136" fill="none" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
